openapi: 3.0.3
info:
  title: Zeus Sales API
  version: 1.0.0
  description: >-
    OpenAPI specification for the Zeus Sales module.
    Responses use a unified envelope: {message, statusCode, metadata, data}.
    All endpoints require a valid Bearer JWT unless stated otherwise.
servers:
  - url: http://localhost:8081/api/v1/sales
    description: Local development server
security:
  - BearerAuth: []

tags:
  - name: Orders
    description: >-
      Sales order lifecycle — create, retrieve, update, and cancel orders.
      Orders are automatically queued for fulfillment upon creation.
  - name: Clients
    description: >-
      Client account management — create and maintain customer profiles
      including their account tier (B2B / B2C) and default delivery address.
  - name: Fulfillment
    description: >-
      Inventory allocation queue — trigger processing of pending orders
      and inspect the current queue state.
  - name: Metrics
    description: >-
      Sales KPI dashboard — aggregate counters and value summaries for
      operational monitoring (admin only).

paths:

  # ──────────────────────────────────────────────
  # Orders
  # ──────────────────────────────────────────────
  /orders:
    get:
      tags: [Orders]
      summary: List sales orders
      description: >-
        Return a paginated list of sales orders with optional filtering
        by order state and required date.
      operationId: listOrders
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based)
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page
        - in: query
          name: states
          schema:
            type: string
          description: Comma-separated order state codes (e.g. PENDING,PROCESSING)
          example: "PENDING,PROCESSING"
        - in: query
          name: date
          schema:
            type: string
            format: date
          description: Filter by required date (YYYY-MM-DD)
          example: "2026-06-01"
      responses:
        '200':
          description: List of orders returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                success:
                  value:
                    message: "List orders successful"
                    statusCode: 200
                    metadata:
                      page: 1
                      pageSize: 10
                      total: 1
                      totalPages: 1
                    data:
                      - orderId: "00000000-0000-0000-0000-000000000000"
                        clientName: "Orbit Co"
                        requiredDate: "2026-06-01T00:00:00Z"
                        status: "PENDING"
                        totalValue: 100.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Orders]
      summary: Create a sales order
      description: >-
        Create a new sales order and automatically queue it for inventory
        fulfillment. The client is resolved from the authenticated context.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              standard:
                summary: Standard order
                value:
                  requiredDate: "2026-06-15T00:00:00Z"
                  items:
                    - sku: "SKU-100"
                      requestedQty: 3
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                created:
                  value:
                    message: "Order created"
                    statusCode: 201
                    data:
                      order:
                        id: "00000000-0000-0000-0000-000000000000"
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Orders]
      summary: Get order details
      description: Retrieve full order details including line items and client info.
      operationId: getOrder
      responses:
        '200':
          description: Order details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                order:
                  value:
                    message: "Order retrieved"
                    statusCode: 200
                    data:
                      order:
                        id: "00000000-0000-0000-0000-000000000000"
                        destination_address: "42 Industrial Rd, Ho Chi Minh City"
                        required_date: "2026-06-01T00:00:00Z"
                        status:
                          id: "33333333-3333-3333-3333-333333333333"
                          code: "PENDING"
                          label: "Pending"
                          sort_order: 1
                          created_at: "2026-05-27T00:00:00Z"
                          updated_at: "2026-05-27T00:00:00Z"
                        total_value: 100.0
                        locked: false
                        created_at: "2026-05-27T00:00:00Z"
                        updated_at: "2026-05-27T00:00:00Z"
                      client:
                        id: "11111111-1111-1111-1111-111111111111"
                        name: "Orbit Co"
                        tier: "B2C"
                        default_destination_address: "42 Industrial Rd, Ho Chi Minh City"
                        total_lifetime_orders: 1
                        created_at: "2026-05-27T00:00:00Z"
                        updated_at: "2026-05-27T00:00:00Z"
                      items:
                        - id: "22222222-2222-2222-2222-222222222222"
                          sku: "SKU-100"
                          requested_qty: 3
                          created_at: "2026-05-27T00:00:00Z"
                          updated_at: "2026-05-27T00:00:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Orders]
      summary: Update a pending order
      description: >-
        Update destination address, required date, or line items while the
        order is still in PENDING state. Locked or processing orders are rejected.
      operationId: updateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Conflict — order is locked or no longer editable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                locked:
                  value:
                    message: "conflict: order is locked or no longer editable"
                    statusCode: 409
                    metadata: {}
                    data: {}
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Orders]
      summary: Trigger inventory reservation
      description: >-
        Trigger inventory reservation and MRP processing for the selected order.
        This promotes the order from PENDING to PROCESSING.
      operationId: reserveOrder
      responses:
        '200':
          description: Reservation triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                triggered:
                  value:
                    message: "reserve triggered"
                    statusCode: 200
                    data: {}
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      tags: [Orders]
      summary: Cancel an order
      description: >-
        Cancel a PENDING order through a dedicated action endpoint.
        Orders that have already started processing cannot be cancelled.
      operationId: cancelOrder
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                cancelled:
                  value:
                    message: "order cancelled"
                    statusCode: 200
                    data: {}
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict — cannot cancel once processing has started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                processing:
                  value:
                    message: "conflict: order cannot be cancelled once processing has started"
                    statusCode: 409
                    metadata: {}
                    data: {}

  # ──────────────────────────────────────────────
  # Clients
  # ──────────────────────────────────────────────
  /clients:
    get:
      tags: [Clients]
      summary: List clients
      description: Return a paginated list of clients with optional tier filtering.
      operationId: listClients
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based)
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page
        - in: query
          name: tiers
          schema:
            type: string
          description: Comma-separated client tiers to filter (B2B,B2C)
          example: "B2B,B2C"
      responses:
        '200':
          description: Clients listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                clients:
                  value:
                    message: "Clients listed"
                    statusCode: 200
                    metadata:
                      page: 1
                      pageSize: 10
                      total: 2
                      totalPages: 1
                    data:
                      - id: "11111111-1111-1111-1111-111111111111"
                        name: "Acme Corp"
                        tier: "B2B"
                        default_destination_address: "42 Industrial Rd"
                        total_lifetime_orders: 5
                      - id: "22222222-2222-2222-2222-222222222222"
                        name: "Jane Doe"
                        tier: "B2C"
                        default_destination_address: ""
                        total_lifetime_orders: 1
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Clients]
      summary: Create a client
      description: >-
        Create a new client account with a unique name, an account tier
        (B2B for enterprise, B2C for consumer), and an optional default
        delivery address. Requires `admin` or `sales_operator` role.
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
            examples:
              b2b_client:
                summary: B2B enterprise client
                value:
                  name: "Acme Corp"
                  tier: "B2B"
                  defaultDestinationAddress: "42 Industrial Rd, Ho Chi Minh City"
              b2c_client:
                summary: B2C consumer client
                value:
                  name: "Jane Doe"
                  tier: "B2C"
                  defaultDestinationAddress: ""
      responses:
        '201':
          description: Client created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                created:
                  value:
                    message: "Client created"
                    statusCode: 201
                    data:
                      id: "11111111-1111-1111-1111-111111111111"
                      name: "Acme Corp"
                      tier: "B2B"
                      default_destination_address: "42 Industrial Rd, Ho Chi Minh City"
                      total_lifetime_orders: 0
                      created_at: "2026-05-25T05:00:00Z"
                      updated_at: "2026-05-25T05:00:00Z"
        '400':
          description: Validation error — missing name or invalid tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missing_name:
                  value:
                    message: "validation error: client name is required"
                    statusCode: 400
                    metadata: {}
                    data: {}
                invalid_tier:
                  value:
                    message: "validation error: tier must be B2B or B2C"
                    statusCode: 400
                    metadata: {}
                    data: {}
        '409':
          description: Conflict — a client with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                duplicate:
                  value:
                    message: "conflict: a client with this name already exists"
                    statusCode: 409
                    metadata: {}
                    data: {}
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [Clients]
      summary: Get client profile
      description: Retrieve a client profile by UUID.
      operationId: getClient
      responses:
        '200':
          description: Client returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                client:
                  value:
                    message: "OK"
                    statusCode: 200
                    data:
                      id: "11111111-1111-1111-1111-111111111111"
                      name: "Acme Corp"
                      tier: "B2B"
                      default_destination_address: "42 Industrial Rd"
                      total_lifetime_orders: 5
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-05-01T00:00:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Clients]
      summary: Update client profile
      description: >-
        Update one or more editable fields on a client profile: name, tier,
        or default destination address. At least one field must be provided.
      operationId: updateClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
            examples:
              rename:
                summary: Rename the client
                value:
                  name: "Acme Corporation"
              change_tier:
                summary: Upgrade tier
                value:
                  tier: "B2B"
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Clients]
      summary: Delete client profile
      description: Permanently delete a client profile by UUID.
      operationId: deleteClient
      responses:
        '200':
          description: Client deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                deleted:
                  value:
                    message: "Client deleted"
                    statusCode: 200
                    data: {}
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ──────────────────────────────────────────────
  # Fulfillment
  # ──────────────────────────────────────────────
  /fulfillment/process:
    post:
      tags: [Fulfillment]
      summary: Process allocation queue
      description: >-
        Start processing all pending entries in the inventory allocation queue.
        Each entry allocates stock to a sales order and advances its status.
      operationId: processFulfillmentQueue
      responses:
        '200':
          description: Processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                started:
                  value:
                    message: "processing started"
                    statusCode: 200
                    data: {}
        '500':
          $ref: '#/components/responses/InternalError'

  /fulfillment/queue:
    get:
      tags: [Fulfillment]
      summary: View allocation queue
      description: >-
        Return the current state of the fulfillment allocation queue,
        showing all pending order entries awaiting stock allocation.
      operationId: getFulfillmentQueue
      responses:
        '200':
          description: Queue status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                queue:
                  value:
                    message: "OK"
                    statusCode: 200
                    data:
                      entries:
                        - orderId: "00000000-0000-0000-0000-000000000000"
                          clientName: "Orbit Co"
                          queuedAt: "2026-05-25T05:00:00Z"
        '500':
          $ref: '#/components/responses/InternalError'

  # ──────────────────────────────────────────────
  # Metrics
  # ──────────────────────────────────────────────
  /metrics:
    get:
      tags: [Metrics]
      summary: Sales KPI metrics
      description: >-
        Return aggregate sales KPI counters: total pending orders, active
        processing value, and orders completed in the last 24 hours.
        Restricted to `admin` role.
      operationId: getSalesMetrics
      responses:
        '200':
          description: Metrics returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                metrics:
                  value:
                    message: "OK"
                    statusCode: 200
                    data:
                      total_pending: 12
                      active_processing_value: 48500.75
                      completed_24h: 3
        '500':
          $ref: '#/components/responses/InternalError'

components:

  # ──────────────────────────────────────────────
  # Security
  # ──────────────────────────────────────────────
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Provide the access token in the Authorization header as
        `Bearer <access-token>`.

  # ──────────────────────────────────────────────
  # Reusable Parameters
  # ──────────────────────────────────────────────
  parameters:
    ResourceID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the resource

  # ──────────────────────────────────────────────
  # Reusable Responses
  # ──────────────────────────────────────────────
  responses:
    BadRequest:
      description: Bad request — invalid query parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                message: "bad request: invalid filter"
                statusCode: 400
                metadata: {}
                data: {}

    ValidationError:
      description: Validation error — a required field is missing or has an invalid value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                message: "validation error: field is required"
                statusCode: 400
                metadata: {}
                data: {}

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                message: "not found"
                statusCode: 404
                metadata: {}
                data: {}

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                message: "internal server error"
                statusCode: 500
                metadata: {}
                data: {}

  # ──────────────────────────────────────────────
  # Schemas
  # ──────────────────────────────────────────────
  schemas:
    Envelope:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: integer
        metadata:
          type: object
        data:
          type: object

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      description: Error response wrapped in the standard envelope

    # --- Orders ---
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        destination_address:
          type: string
        required_date:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/OrderStatusLUT'
        total_value:
          type: number
          format: float
        locked:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderStatusLUT:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          enum: [PENDING, PROCESSING, DELIVERING, COMPLETED, CANCELLED]
        label:
          type: string
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        requested_qty:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderItemRequest:
      type: object
      required: [sku, requestedQty]
      properties:
        sku:
          type: string
          example: "SKU-100"
        requestedQty:
          type: integer
          minimum: 1
          example: 3

    CreateOrderRequest:
      type: object
      required: [requiredDate, items]
      properties:
        requiredDate:
          type: string
          format: date-time
          description: Target fulfillment date (RFC3339)
          example: "2026-06-15T00:00:00Z"
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    UpdateOrderRequest:
      type: object
      description: All fields are optional; at least one must be provided.
      properties:
        destinationAddress:
          type: string
        requiredDate:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    # --- Clients ---
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tier:
          type: string
          enum: [B2B, B2C]
        default_destination_address:
          type: string
        total_lifetime_orders:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateClientRequest:
      type: object
      required: [name, tier]
      properties:
        name:
          type: string
          description: Unique display name for the client
          example: "Acme Corp"
        tier:
          type: string
          enum: [B2B, B2C]
          description: Account tier — B2B for enterprise, B2C for consumer
          example: "B2B"
        defaultDestinationAddress:
          type: string
          description: Optional default shipping / delivery address
          example: "42 Industrial Rd, Ho Chi Minh City"

    UpdateClientRequest:
      type: object
      description: All fields are optional; at least one must be provided.
      properties:
        name:
          type: string
          description: New display name
        tier:
          type: string
          enum: [B2B, B2C]
          description: New account tier
        defaultDestinationAddress:
          type: string
          description: New default delivery address

    # --- Shared ---
    PaginationMetadata:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    MetricsData:
      type: object
      properties:
        total_pending:
          type: integer
        active_processing_value:
          type: number
          format: float
        completed_24h:
          type: integer
