openapi: 3.0.3
info:
  title: Zeus MRP API
  version: 1.0.0
  description: >-
    OpenAPI specification for the Zeus Material Requirements Planning (mrp) module.
    Responses use a unified envelope: {message, statusCode, metadata, data}.
    All endpoints require a valid Bearer JWT.
servers:
  - url: /api/v1/mrp
    description: Local development server proxy path
security:
  - BearerAuth: []

tags:
  - name: Readiness
    description: >-
      Production readiness matrix and component shortages. Helps operators check
      if they have enough inventory components to build queued production orders.
  - name: Catalog
    description: >-
      Bill of Materials (BOM) catalog and product assemblies. Encompasses CRUD
      operations on assemblies and finding where parts are used.
  - name: Demand
    description: >-
      Material demand summaries, metrics, PO drafting for shortages,
      and stock picking lists generation for order fulfillment.
  - name: Inventory
    description: >-
      Read-only proxy to the SCM module inventory. Encompasses ledger transactions,
      metrics, CSV export, and stock level balance verification.
  - name: Production Orders
    description: >-
      Triggering of new production order builds for assembly product models.

paths:
  # ──────────────────────────────────────────────
  # Readiness
  # ──────────────────────────────────────────────
  /readiness:
    get:
      tags: [Readiness]
      summary: List production readiness matrix
      description: >-
        Return a paginated list of production readiness rows with status filters
        and keyword searching capability.
      operationId: getReadinessMatrix
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [CLEAR_TO_BUILD, PARTIAL, SHORTAGE, PLANNED]
          description: Filter readiness matrix by build status
          example: CLEAR_TO_BUILD
        - in: query
          name: search
          schema:
            type: string
          description: Search pattern matching order ID or SKU
          example: "DRONE-V1"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based)
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            default: 20
          description: Number of items per page
      responses:
        '200':
          description: List of readiness matrix rows returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessMatrixListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /readiness/metrics:
    get:
      tags: [Readiness]
      summary: Get readiness metrics
      description: Retrieve overall readiness metrics including open orders and blocked shortage status.
      operationId: getReadinessMetrics
      responses:
        '200':
          description: Readiness metrics returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessMetricsEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /readiness/export:
    get:
      tags: [Readiness]
      summary: Export readiness report
      description: Retrieve the full readiness report as a raw JSON payload with metrics and rows.
      operationId: exportReadinessReport
      responses:
        '200':
          description: Exported readiness report JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessExportEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /readiness/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    get:
      tags: [Readiness]
      summary: Get order readiness detail
      description: Retrieve readiness row information for a specific production order ID.
      operationId: getReadinessByOrderID
      responses:
        '200':
          description: Readiness matrix row returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessMatrixRowEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /readiness/{orderId}/generate-po:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    post:
      tags: [Readiness]
      summary: Generate PO for order deficits
      description: >-
        Trigger a draft Purchase Order draft creation in SCM for all component shortages in this order.
        Restricted to `mrp_operator` and `admin` roles.
      operationId: generatePOForDeficits
      responses:
        '201':
          description: Draft PO successfully generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessPOResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /shortages:
    get:
      tags: [Readiness]
      summary: List component shortages
      description: Retrieve a paginated overview of all currently active component shortages.
      operationId: getShortages
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based)
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            default: 20
          description: Number of items per page
      responses:
        '200':
          description: List of shortages returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortagesListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # ──────────────────────────────────────────────
  # Catalog
  # ──────────────────────────────────────────────
  /assemblies:
    get:
      tags: [Catalog]
      summary: List assemblies
      description: Retrieve a paginated list of assembly product designs.
      operationId: getAssemblies
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based)
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            default: 20
          description: Number of items per page
      responses:
        '200':
          description: List of assembly designs returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssembliesListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Catalog]
      summary: Create assembly design
      description: Define a new BOM assembly map using existing component SKUs.
      operationId: createAssembly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssemblyRequest'
      responses:
        '201':
          description: Assembly design successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /assemblies/{id}:
    parameters:
      - $ref: '#/components/parameters/AssemblyID'
    get:
      tags: [Catalog]
      summary: Get assembly design detail
      description: Retrieve full assembly details including component SKU requirements.
      operationId: getAssemblyDetail
      responses:
        '200':
          description: Assembly details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyResponseEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Catalog]
      summary: Update assembly design
      description: Modify name, description, or component list for an assembly model code.
      operationId: updateAssembly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssemblyRequest'
      responses:
        '200':
          description: Assembly updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Catalog]
      summary: Delete assembly design
      description: Permanently remove the assembly BOM definition.
      operationId: deleteAssembly
      responses:
        '204':
          description: Assembly deleted successfully (No Content)
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalog:
    get:
      tags: [Catalog]
      summary: List catalog models
      description: Retrieve a paginated list of catalog product model codes defined in the database.
      operationId: getCatalog
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based)
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            default: 20
          description: Number of items per page
      responses:
        '200':
          description: Catalog list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalog]
      summary: Create catalog component
      description: Add a new component part to the catalog.
      operationId: createCatalogPart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, description]
              properties:
                sku:
                  type: string
                  example: "SKU-MOTOR-01"
                description:
                  type: string
                  example: "High-torque brushless DC motor"
                price:
                  type: number
                  format: double
                  example: 45.50
      responses:
        '201':
          description: Component successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalog/{sku}:
    parameters:
      - in: path
        name: sku
        required: true
        schema:
          type: string
        description: Unique SKU of the component
    put:
      tags: [Catalog]
      summary: Update catalog component
      description: Edit description and/or price of an existing component by its SKU.
      operationId: updateCatalogPart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  example: "Updated motor description"
                price:
                  type: number
                  format: double
                  example: 49.99
      responses:
        '200':
          description: Component successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Catalog]
      summary: Delete catalog component
      description: Permanently remove a component from the catalog by its SKU.
      operationId: deleteCatalogPart
      responses:
        '204':
          description: Component deleted successfully (No Content)
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalog/{sku}/where-used:
    parameters:
      - in: path
        name: sku
        required: true
        schema:
          type: string
        description: Part ID UUID to query for usage
      
    get:
      tags: [Catalog]
      summary: Find component usages (Where-Used)
      description: Returns a list of parent assemblies that reference the specified component part.
      operationId: getWhereUsed
      responses:
        '200':
          description: Where-used mapping list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhereUsedListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # ──────────────────────────────────────────────
  # Demand
  # ──────────────────────────────────────────────
  /demand/metrics:
    get:
      tags: [Demand]
      summary: Get demand metrics
      description: Retrieve demand-centric KPI values such as total required units and status breakdowns.
      operationId: getDemandMetrics
      responses:
        '200':
          description: Demand KPI metrics returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandMetricsEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /demand:
    get:
      tags: [Demand]
      summary: List material demand summary
      description: Retrieve a paginated summary of shortages and raised PO count status grouped by order.
      operationId: getDemandSummary
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search by Order ID or Target Build product code
          example: "PO-1002"
        - in: query
          name: status
          schema:
            type: string
            enum: [CLEAR_TO_BUILD, PARTIAL, SHORTAGE, PLANNED]
          description: Filter by status
          example: "SHORTAGE"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based)
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            default: 20
          description: Number of items per page
      responses:
        '200':
          description: Demand summary list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandSummaryListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /demand/generate-pos:
    post:
      tags: [Demand]
      summary: Trigger shortage PO draft generation
      description: Start background task to generate draft purchase orders in SCM for all currently active shortages.
      operationId: generatePOs
      responses:
        '200':
          description: PO generation task started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandPOGenerateEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /demand/{orderId}/pick-list:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    get:
      tags: [Demand]
      summary: Get picking list
      description: Retrieve warehouse picking bin locations list details for this order.
      operationId: getPickList
      responses:
        '200':
          description: Pick list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Demand]
      summary: Generate picking list
      description: Create/regenerate picking list bin layout allocations for an order.
      operationId: generatePickList
      responses:
        '201':
          description: Pick list created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ──────────────────────────────────────────────
  # Inventory
  # ──────────────────────────────────────────────
  /inventory/ledger:
    get:
      tags: [Inventory]
      summary: List inventory ledger transactions
      description: Proxy request to retrieve paginated SCM inventory transaction ledger logs.
      operationId: getInventoryLedger
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [All, Stock In, Stock Out, Adjustments]
          description: Filter transactions by movement type
          example: Stock In
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based)
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            default: 20
          description: Number of items per page
      responses:
        '200':
          description: Ledger list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLedgerListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /inventory/metrics:
    get:
      tags: [Inventory]
      summary: Get inventory metrics
      description: Proxy request to retrieve active SKUs, turnover rates, and accuracy indices.
      operationId: getInventoryMetrics
      responses:
        '200':
          description: Inventory metrics returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMetricsEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /inventory/ledger/export:
    get:
      tags: [Inventory]
      summary: Export inventory ledger (CSV)
      description: Retrieve the inventory ledger history as a raw download CSV stream.
      operationId: exportInventoryCSV
      responses:
        '200':
          description: CSV file generated successfully
          content:
            text/csv:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'

  /inventory/transactions/{txnId}:
    parameters:
      - in: path
        name: txnId
        required: true
        schema:
          type: string
        description: Unique transaction reference identifier
    get:
      tags: [Inventory]
      summary: Get inventory transaction
      description: Retrieve a single inventory ledger change transaction detail by ID.
      operationId: getInventoryTransactionByID
      responses:
        '200':
          description: Transaction detail returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryTransactionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /inventory/balance/{sku}:
    parameters:
      - in: path
        name: sku
        required: true
        schema:
          type: string
        description: Component SKU string identifier
    get:
      tags: [Inventory]
      summary: Get inventory balance for SKU
      description: Retrieve current stock levels and allocated reserves for a given SKU.
      operationId: getInventoryBalanceBySKU
      responses:
        '200':
          description: Balance returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ──────────────────────────────────────────────
  # Production Orders
  # ──────────────────────────────────────────────
  /production/orders:
    post:
      tags: [Production Orders]
      summary: Create production order
      description: Draft a new build order using assembly instructions for a target quantity.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductionOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide the access token in the Authorization header as `Bearer <access-token>`.

  parameters:
    OrderID:
      in: path
      name: orderId
      required: true
      schema:
        type: string
        format: uuid
      description: Unique UUID identifier of the production order

    AssemblyID:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Model code name representing the assembly

  responses:
    BadRequest:
      description: Bad request — invalid query parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                message: "bad request: invalid filter parameters"
                statusCode: 400
                metadata: {}
                data: {}

    ValidationError:
      description: Validation error — missing or invalid fields in request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                message: "validation error: target_quantity is required"
                statusCode: 400
                metadata: {}
                data: {}

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                message: "resource not found"
                statusCode: 404
                metadata: {}
                data: {}

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                message: "internal database connection error"
                statusCode: 500
                metadata: {}
                data: {}

  schemas:
    Envelope:
      type: object
      properties:
        message:
          type: string
          example: "Success"
        statusCode:
          type: integer
          example: 200
        metadata:
          type: object
          nullable: true
        data:
          type: object
          nullable: true

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      description: Error payload wrapper envelope

    PaginationMetadata:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          description: Current page number
          example: 1
        per_page:
          type: integer
          description: Size limit per page
          example: 20
        total:
          type: integer
          description: Total rows matching filters
          example: 100
        total_pages:
          type: integer
          description: Total pages count
          example: 5

    # --- Readiness matrix & shortages ---
    ReadinessMatrixRow:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
          example: "a687bc12-9c3f-4e09-ba22-87ff819c991a"
        target_build:
          type: string
          example: "Drone-V1"
        quantity:
          type: integer
          example: 20
        status:
          type: string
          enum: [CLEAR_TO_BUILD, PARTIAL, SHORTAGE]
          example: "CLEAR_TO_BUILD"
        deficit_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/BOMExplosionResult'

    BOMExplosionResult:
      type: object
      properties:
        part_id:
          type: string
          format: uuid
          example: "bc38ad82-019a-4122-bd55-9011abcc2290"
        component_sku:
          type: string
          example: "SKU-BATTERY-01"
        total_required_qty:
          type: integer
          example: 20
        available_qty:
          type: integer
          example: 5
        is_shortage:
          type: boolean
          example: true

    ShortageLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "ea3b2f8a-9a99-4c12-8bb1-90fa7e2b19cf"
        production_order_id:
          type: string
          format: uuid
          example: "a687bc12-9c3f-4e09-ba22-87ff819c991a"
        part_id:
          type: string
          format: uuid
          example: "bc38ad82-019a-4122-bd55-9011abcc2290"
        shortage_qty:
          type: integer
          example: 15
        resolution_status_id:
          type: integer
          example: 2
        resolution_status:
          type: string
          enum: [planned, partial, shortage, ready_to_build]
          example: "shortage"

    ReadinessMetrics:
      type: object
      properties:
        total_open_orders:
          type: integer
          example: 10
        components_in_shortage:
          type: integer
          example: 4
        blocked_orders:
          type: integer
          example: 3
        supply_readiness_rate:
          type: number
          format: double
          example: 70.0

    # --- Assemblies & Catalog ---
    ComponentReference:
      type: object
      required: [sku, qty]
      properties:
        sku:
          type: string
          description: Unique SKU representing the sub-part component ID
          example: "bc38ad82-019a-4122-bd55-9011abcc2290"
        qty:
          type: integer
          minimum: 1
          description: Stock quantity required per single assembly unit
          example: 4

    AssemblyResponse:
      type: object
      properties:
        model_code:
          type: string
          example: "Drone-V1"
        name:
          type: string
          example: "Standard Quadcopter Build"
        description:
          type: string
          example: "Drone assembly including standard chassis and battery pack."
        total_parts:
          type: integer
          example: 2
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentReference'
        unit_price:
          type: number
          format: double
          example: 245.50

