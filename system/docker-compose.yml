services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: zeus-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  valkey-data:
