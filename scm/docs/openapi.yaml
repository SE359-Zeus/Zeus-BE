openapi: "3.0.3"
info:
  title: Zeus SCM API
  description: Supply Chain Management module of the Zeus ERP system. Governs procurement, inventory, goods receipt, and outbound logistics.
  version: "1.0.0"
servers:
  - url: /api/v1/scm
    description: API base path

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    SuccessResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          nullable: true
    SuccessListResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          type: object
          properties:
            items:
              type: array
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total_rows:
          type: integer
        total_pages:
          type: integer
    PurchaseOrder:
      type: object
      properties:
        id:
          type: string
          example: PO-2025-1
        vendor_id:
          type: string
          format: uuid
        target_build:
          type: string
        status:
          type: string
          enum: [Draft, Approved, In Transit, Received, Partial, Void]
        total_value:
          type: number
          format: float
        payment_terms:
          type: string
        expected_delivery:
          type: string
          format: date-time
        notes:
          type: string
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/POLineItem'
    POLineItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        po_id:
          type: string
        sku:
          type: string
        description:
          type: string
        ordered_qty:
          type: integer
        received_qty:
          type: integer
        unit_price:
          type: number
          format: float
    Supplier:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contact:
          type: string
        tier:
          type: string
          enum: ["Tier 1", "Tier 2", "Tier 3"]
        lead_time_days:
          type: integer
        quality_score:
          type: number
          format: float
        on_time_rate:
          type: number
          format: float
    SkuMapping:
      type: object
      properties:
        id:
          type: string
          format: uuid
        supplier_id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        unit_price:
          type: number
          format: float
        lead_time_days:
          type: integer
        min_order_qty:
          type: integer
    GoodsReceipt:
      type: object
      properties:
        id:
          type: string
          example: GR-2025-1
        po_ref:
          type: string
        vendor_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [Pending, Inspected, Complete, Discrepancy]
        arrival_date:
          type: string
          format: date-time
        operator_id:
          type: string
        locked_by:
          type: string
          nullable: true
        lock_expires_at:
          type: string
          format: date-time
          nullable: true
    GRLineItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gr_id:
          type: string
        sku:
          type: string
        name:
          type: string
        ordered_qty:
          type: integer
        received_qty:
          type: integer
          nullable: true
        defective_qty:
          type: integer
          nullable: true
        aging_sensitive:
          type: boolean
        production_date:
          type: string
          format: date
          nullable: true
        aging_label:
          type: string
    Shipment:
      type: object
      properties:
        id:
          type: string
          example: SHP-2026-1
        po_ref:
          type: string
        supplier_id:
          type: string
          format: uuid
        supplier:
          $ref: '#/components/schemas/Supplier'
        status:
          type: string
          enum: [Scheduled, In Transit, Delivered, Delayed]
        carrier:
          type: string
        tracking_no:
          type: string
        origin:
          type: string
        ship_date:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentItem'
    ShipmentItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        shipment_id:
          type: string
        sku:
          type: string
        description:
          type: string
        qty:
          type: integer
    Carrier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: DHL Express
        code:
          type: string
          example: DHL
    ComponentStock:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        category:
          type: string
        stock_qty:
          type: integer
        reorder_point:
          type: integer
        unit_cost:
          type: number
          format: float
        status:
          type: string
          enum: [In Stock, Low Stock, Out of Stock, Discontinued]
        primary_supplier_id:
          type: string
          format: uuid
        primary_supplier:
          type: string
        lead_time_days:
          type: integer
        location:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_model_code:
          type: string
        customer_id:
          type: string
          format: uuid
        product_name:
          type: string
        serial_number:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Part:
      type: object
      properties:
        id:
          type: string
          format: uuid
        part_catalog_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          nullable: true
        serial_number:
          type: string
        part_condition_id:
          type: integer
        manufactured_date:
          type: string
          format: date-time
        installation_date:
          type: string
          format: date-time
          nullable: true
        removal_date:
          type: string
          format: date-time
          nullable: true
        scrapped_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InventoryLedger:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        type:
          type: string
          enum: [IN, OUT, ADJ]
        qty_change:
          type: integer
        running_balance:
          type: integer
        location:
          type: string
        operator_id:
          type: string
        reference:
          type: string
        reference_type:
          type: string
          enum: [goods_receipt, shipment, adjustment, initial]
        reference_id:
          type: string
        created_at:
          type: string
          format: date-time
    PartCatalog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        part_number:
          type: string
        part_types_id:
          type: integer
        mfg_number:
          type: string
        description:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        part_mfg_status:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
    ProductModel:
      type: object
      properties:
        model_code:
          type: string
        model_name:
          type: string
        description:
          type: string
          nullable: true
        unit_price:
          type: number
          format: float
        image_name:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

security:
  - BearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      tags: [System]
      security: []
      responses:
        '200':
          description: OK

  /vendors/optimal:
    get:
      summary: Route component shortage to optimal supplier
      tags: [Vendors]
      parameters:
        - name: sku
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Optimal supplier and mapping
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          supplier:
                            $ref: '#/components/schemas/Supplier'
                          mapping:
                            $ref: '#/components/schemas/SkuMapping'
        '404':
          description: No optimal supplier found

  /vendors/{id}/recalc-metrics:
    post:
      summary: Recalculate supplier OnTimeRate and QualityScore
      tags: [Vendors]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Metrics updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /vendors:
    get:
      summary: List suppliers with optional tier filtering, query search, and pagination
      tags: [Vendors]
      parameters:
        - name: tier
          in: query
          required: false
          schema:
            type: string
            enum: ["Tier 1", "Tier 2", "Tier 3"]
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 15
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            default: created_at
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of suppliers and pagination metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      metadata:
                        type: object
                        properties:
                          pagination:
                            $ref: '#/components/schemas/PaginationMeta'
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Supplier'
    post:
      summary: Create a new supplier
      tags: [Vendors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                contact:
                  type: string
                tier:
                  type: string
                  enum: ["Tier 1", "Tier 2", "Tier 3"]
                lead_time_days:
                  type: integer
              required: [name, contact, tier, lead_time_days]
      responses:
        '201':
          description: Supplier created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Supplier'

  /vendors/metrics:
    get:
      summary: Retrieve supplier metrics (total active, average on-time delivery rate)
      tags: [Vendors]
      responses:
        '200':
          description: Supplier metrics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          total_active_suppliers:
                            type: integer
                          on_time_delivery_rate:
                            type: number
                            format: float

  /vendors/{id}/sku-mappings:
    post:
      summary: Create a new SKU mapping for a supplier
      tags: [Vendors]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                name:
                  type: string
                unit_price:
                  type: number
                  format: float
                lead_time_days:
                  type: integer
                min_order_qty:
                  type: integer
              required: [sku, name, unit_price, lead_time_days, min_order_qty]
      responses:
        '201':
          description: SKU mapping created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SkuMapping'

  /vendors/export:
    get:
      summary: Export report of suppliers and their SKU mappings as CSV stream
      tags: [Vendors]
      responses:
        '200':
          description: CSV file download stream
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="suppliers_report.csv"
            Content-Type:
              schema:
                type: string
                example: text/csv
          content:
            text/csv:
              schema:
                type: string

  /purchase-orders/export:
    get:
      summary: Export all purchase orders with line items as CSV stream
      tags: [Purchase Orders]
      responses:
        '200':
          description: CSV file download stream
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="purchase_orders_report.csv"
            Content-Type:
              schema:
                type: string
                example: text/csv
          content:
            text/csv:
              schema:
                type: string
                description: >
                  CSV with columns: PO ID, Vendor Name, Target Build, Status,
                  Expected Delivery, Total Value, Notes, Line Item SKU,
                  Line Item Description, Ordered Qty, Unit Price, Line Item Subtotal.
                  One row per line item; POs without line items still produce a row
                  with blank line-item fields.

  /purchase-orders:
    get:
      summary: List purchase orders with pagination
      tags: [Purchase Orders]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 15
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            default: created_at
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of purchase orders and pagination metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      metadata:
                        type: object
                        properties:
                          pagination:
                            $ref: '#/components/schemas/PaginationMeta'
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PurchaseOrder'
    post:
      summary: Create a custom purchase order with line items and notes
      tags: [Purchase Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: PO-2024-110
                expected_delivery:
                  type: string
                  format: date-time
                vendor_id:
                  type: string
                  format: uuid
                notes:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      sku:
                        type: string
                      qty:
                        type: integer
                    required: [sku, qty]
              required: [id, expected_delivery, vendor_id, items]
      responses:
        '201':
          description: Purchase order created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PurchaseOrder'

  /purchase-orders/{poId}:
    get:
      summary: Get detailed purchase order by ID including line items
      tags: [Purchase Orders]
      parameters:
        - name: poId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed purchase order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PurchaseOrder'

  /purchase-orders/draft:
    post:
      summary: Create a new PO draft
      tags: [Purchase Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vendor_id:
                  type: string
                  format: uuid
                target_build:
                  type: string
              required: [vendor_id]
      responses:
        '201':
          description: PO draft created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PurchaseOrder'

  /purchase-orders/{poId}/line-items:
    post:
      summary: Add a line item with Eager Slot-Locking (30-min TTL)
      tags: [Purchase Orders]
      parameters:
        - name: poId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                qty:
                  type: integer
                  minimum: 1
              required: [sku, qty]
      responses:
        '200':
          description: Line item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /purchase-orders/{poId}/approve:
    post:
      summary: Approve PO (transition Draft→Approved)
      tags: [Purchase Orders]
      parameters:
        - name: poId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PO approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /purchase-orders/{poId}/state:
    put:
      summary: Transition PO state (forward only)
      tags: [Purchase Orders]
      parameters:
        - name: poId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_state:
                  type: string
                  enum: [Draft, Approved, In Transit, Received, Partial, Void]
              required: [new_state]
      responses:
        '200':
          description: State transitioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /goods-receipts:
    get:
      summary: List all goods receipts with pagination and status filter
      tags: [Goods Receipts]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Pending, Inspected, Complete, Discrepancy]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 15
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            default: created_at
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of Goods Receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: integer
                  metadata:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total_rows:
                            type: integer
                          total_pages:
                            type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GoodsReceipt'

  /goods-receipts/metrics:
    get:
      summary: Get Goods Receipt dashboard metrics
      tags: [Goods Receipts]
      responses:
        '200':
          description: Goods Receipt Metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: integer
                  metadata:
                    type: object
                  data:
                    type: object
                    properties:
                      pending_receipts:
                        type: integer
                      completed_today:
                        type: integer
                      active_discrepancies:
                        type: integer
                      inspection_queue:
                        type: integer

  /goods-receipts/{grId}:
    get:
      summary: Get details of a Goods Receipt by ID
      tags: [Goods Receipts]
      parameters:
        - name: grId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Goods Receipt details
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: integer
                  metadata:
                    type: object
                  data:
                    $ref: '#/components/schemas/GoodsReceipt'
        '404':
          description: Goods Receipt not found

  /goods-receipts/{grId}/lock:
    post:
      summary: Acquire 60-min operator lock on Goods Receipt
      tags: [Goods Receipts]
      parameters:
        - name: grId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operator_id:
                  type: string
              required: [operator_id]
      responses:
        '200':
          description: Lock acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '409':
          description: Already locked by another operator
    delete:
      summary: Release 60-min operator lock on Goods Receipt
      tags: [Goods Receipts]
      parameters:
        - name: grId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lock released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /goods-receipts/{grId}/process:
    post:
      summary: Process blind receipt with manual counts
      tags: [Goods Receipts]
      parameters:
        - name: grId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operator_id:
                  type: string
                counts:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      received:
                        type: integer
                        minimum: 0
                      defective:
                        type: integer
                        minimum: 0
              required: [operator_id, counts]
      responses:
        '200':
          description: Blind receipt processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /shipments:
    get:
      summary: List all shipments with pagination and optional status filter
      tags: [Shipments]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Scheduled, In Transit, Delivered, Delayed]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 15
        - name: sort_by
          in: query
          required: false
