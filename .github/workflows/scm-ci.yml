name: scm CI workflow

on:
  push:
    branches: ["main-scm"]
  pull_request:
    branches: ["main-scm"]
  workflow_dispatch:

env:
  GO_VERSION_FILE: scm/go.mod
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/scm
  IMAGE_VERSION: v${{ github.run_number }}
  MANIFEST_REPO: manifest-repo
  MANIFEST_BRANCH: main
  MANIFEST_FILE: scm-docker-compose.yml

defaults:
  run:
    working-directory: scm

jobs:
  tests:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('scm/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v -count=1

  publish-image:
    runs-on: ubuntu-24.04-arm
    needs: tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('scm/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format image name to lowercase
        run: echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}

      - name: Build scm image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scm/Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.IMAGE_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest

  update-manifest-repo:
    runs-on: ubuntu-24.04-arm
    needs: publish-image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format image name to lowercase
        run: echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Checkout manifest repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.MANIFEST_REPO }}
          ref: ${{ env.MANIFEST_BRANCH }}
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          path: manifest-repo

      - name: Update scm-be image tag only (skip migrate and seed to protect DB)
        working-directory: manifest-repo
        env:
          NEW_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.IMAGE_VERSION }}
          FILE: ${{ env.MANIFEST_FILE }}
        run: |
          set -euo pipefail

          export NEW_IMAGE FILE

          if [ ! -f "$FILE" ]; then
            echo "Manifest file not found: $FILE"
            exit 1
          fi

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          file_path = Path(os.environ["FILE"])
          new_image = os.environ["NEW_IMAGE"]
          new_tag = new_image.split(":", 1)[1]

          lines = file_path.read_text().splitlines()
          in_scm_be = False
          count = 0

          for i, line in enumerate(lines):
              # Detect start of a top-level service block (2-space indent)
              if re.match(r'  \w[\w-]*:', line):
                  in_scm_be = 'scm-be:' in line
              # Update only the image line inside scm-be block
              elif in_scm_be and re.match(r'    image:\s*ghcr\.io/se359-zeus/zeus-be/scm:', line):
                  lines[i] = re.sub(
                      r'(image:\s*ghcr\.io/se359-zeus/zeus-be/scm:)\S+',
                      rf'\g<1>' + new_tag,
                      line
                  )
                  count += 1
                  in_scm_be = False

          if count == 0:
              raise SystemExit("scm-be image line not found in manifest file")

          file_path.write_text('\n'.join(lines) + '\n')
          print(f"Updated scm-be to {new_image} ({count} line(s) changed)")
          PY

      - name: Commit and push manifest change
        working-directory: manifest-repo
        env:
          NEW_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.IMAGE_VERSION }}
          FILE: ${{ env.MANIFEST_FILE }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${FILE}"

          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi

          git commit -m "chore(scm): deploy ${NEW_IMAGE}"

          if ! git push origin "${MANIFEST_BRANCH}"; then
            echo "Push failed with non-fast-forward, pulling latest changes and retrying"
            git pull --rebase origin "${MANIFEST_BRANCH}"
            git push origin "${MANIFEST_BRANCH}"
          fi